[project]
name = "bumps"
dynamic = ["version"]
description = "Data fitting with bayesian uncertainty analysis"
readme = "README.rst"
authors = [
    { name = "Paul Kienzle", email = "paul.kienzle@nist.gov" },
]
license = { file = "LICENSE.txt" }
dependencies = [
    'numpy',
    'scikit-learn',
    'scipy',
    'typing_extensions>=3.7.4',
    'graphlib_backport; python_version < "3.9"'
]
classifiers=[
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'License :: Public Domain',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Chemistry',
    'Topic :: Scientific/Engineering :: Physics',
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    'build',
    'pytest',
    'pytest-cov',
    'wheel',
    'setuptools',
    'sphinx',
    'versioningit',
    'matplotlib',
]
webview = [
    'aiohttp',
    'blinker',
    'dill',
    'matplotlib',
    'python-socketio',
    'plotly',
    'mpld3',
    'nodejs',
    'h5py'
]

[project.urls]
documentation = "https://bumps.readthedocs.io"
homepage = "https://bumps.readthedocs.io"
repository = "https://github.com/bumps/bumps"

[build-system]
requires = [
    "hatchling",
    "hatch-sphinx",
    "hatch-vcs",
    "matplotlib",
    "numpy",
    "scikit-learn",
    "scipy",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
version-file = "bumps/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "bin",
  "bumps",
  "doc",
  "extra",
  "test",
]
exclude = [
  "build",
  "venv",
  "amqp_map",
  "fit_functions",
  "jobqueue",
]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = [
    "bumps"
]
# artifacts = [
#     "**/*.so",
# ]

[tool.hatch.build.targets.wheel.force-include]
"doc" = "bumps/docs-source"
"build/docs" = "bumps/docs"

# FIXME: need to do this in a plugin that can tag the wheel properly
