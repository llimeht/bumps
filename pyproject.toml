# FIXME replace doc/genmods.py with sphinx-apidoc?
# [[tool.hatch.build.targets.wheel.hooks.sphinx.tools]]
# tool = "apidoc"
# source = "../bumps"
# out_dir = "api"
# depth = 8
# private = false
# header = "Bumps"

# FIXME replace doc/gentuts.py with a standard tool?
# [[tool.hatch.build.targets.wheel.hooks.sphinx.tools]]
# tool = "custom"
# out_dir = "tutorial"
# commands = [
#    "{python} gentuts.py"
#]

[[tool.hatch.build.targets.wheel.hooks.sphinx.tools]]
tool = "build"
format = "html"
out_dir = "../build/docs"

[project.scripts]
bumps = "bumps.main:main"
bumps-webview = "bumps.webview.server.webserver:main"

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob=*.rst --cov=bumps"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
testpaths = ["bumps", "doc/getting_started", "doc/guide"]
norecursedirs = ["gui", "webview/client"]
python_files = ["*.py"]
python_classes = ["NoClassTestsWillMatch"]
python_functions = ["test", "*_test", "test_*"]
